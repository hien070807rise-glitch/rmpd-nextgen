[workspace]
resolver = "2"
members = [
    "crates/rmpd-dsp",
    "crates/rmpd-player",
    "crates/rmpd-library",
    "crates/rmpd-protocol",
    "crates/rmpd-tagger",
    "crates/rmpd-plugin",
    "crates/rmpd-os-media",
    "crates/rmpd-client-ui",
    "crates/rmpd-launcher",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
rtrb = "0.3"
rustfft = "6.2"
rusqlite = { version = "0.32", features = ["bundled"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
symphonia = { version = "0.5", default-features = false, features = ["pcm", "wav", "flac", "mp3", "ogg", "vorbis", "isomp4"] }
cpal = "0.15"
lofty = "0.21"
notify = { version = "6", default-features = false }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
opt-level = 3
